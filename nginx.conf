proxy_cache_path /var/cache/nginx/wallpapers levels=1:2 keys_zone=wallpapers:8m max_size=512m inactive=30d use_temp_path=off;
map $http_upgrade $panel_connection {
    default upgrade;
    '' close;
}
map $arg_download $wallpaper_disposition {
    default "";
    1 "attachment";
}
server {
    listen 3002;
    listen [::]:3002;
    server_name _;
    client_max_body_size 100m;
    resolver 127.0.0.11 ipv6=off valid=300s;

    # Only known wallpaper paths can reach the fixed image host.
    location ~ "^/wallpaper-cache/(full/[a-z0-9]{2}/wallhaven-[a-z0-9]{6}\.(?:png|jpg|jpeg|webp))$" {
        set $wallpaper_path /$1;
        proxy_pass https://w.wallhaven.cc$wallpaper_path;
        proxy_set_header Host w.wallhaven.cc;
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache wallpapers;
        proxy_cache_key $wallpaper_path;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 25s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Nel;
        proxy_hide_header Report-To;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Wallpaper-Cache $upstream_cache_status;
        add_header Content-Disposition $wallpaper_disposition;
    }
    location /wallpaper-cache/ { return 404; }
    location ~ "^/wallpaper-thumb/(small/[a-z0-9]{2}/[a-z0-9]{6}\.jpg)$" {
        set $thumb_path /$1;
        proxy_pass https://th.wallhaven.cc$thumb_path;
        proxy_set_header Host th.wallhaven.cc;
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache wallpapers;
        proxy_cache_key thumb$thumb_path;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Nel;
        proxy_hide_header Report-To;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }
    location /wallpaper-thumb/ { return 404; }
    location ~ "^/custom/(?:index|anime-wallpaper)\.js$" {
        proxy_pass http://sun-panel:3002;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        proxy_pass http://sun-panel:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $panel_connection;
        proxy_read_timeout 300s;
    }
}
