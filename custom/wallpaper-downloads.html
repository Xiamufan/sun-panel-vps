<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二次元壁纸下载库</title>
<style>body{margin:0;background:#111729;color:#edf2ff;font:15px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:36px 22px}h1{font-size:32px;margin:0}p{color:#aab9d2}a{color:#a8cfff;text-decoration:none}a:hover{text-decoration:underline}.filters{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#111729ee;padding:18px 0;z-index:2}select,input,button{font:inherit;padding:10px 13px;background:#202b43;color:#fff;border:1px solid #3b4b69;border-radius:10px}input{flex:1;min-width:180px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:#1c263c;border:1px solid #33415b;border-radius:16px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover;background:#25334c}.body{padding:14px}.tags{min-height:24px;color:#b6c4df;font-size:13px}.links{display:flex;gap:16px;margin-top:10px}.links a:last-child{color:#83e1ca}.nav{display:flex;justify-content:center;align-items:center;gap:18px;margin:28px 0}#message{color:#c8d6ed}@media(max-width:600px){main{padding:22px 14px}h1{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:110px}.body{padding:10px}.links{font-size:13px;gap:10px}}</style>
<main><h1>二次元壁纸下载库</h1><p>来源：<a href="https://wallhaven.cc" target="_blank" rel="noopener">Wallhaven</a> · 高清原图，持续更新。可以查看来源页，也可以直接下载到电脑。</p>
<div class="filters"><select id="topic" aria-label="作品"><option value="all">全部作品</option></select><select id="quality" aria-label="清晰度"><option value="0">全部高清</option><option value="3840">4K 及以上</option></select><input id="search" aria-label="搜索" placeholder="搜索作品或图片编号"></div>
<p id="message" role="status">正在读取壁纸库…</p><div id="grid" class="grid"></div><div class="nav"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><p>“来源页”可以查看上传者、标签和相关图片；“下载原图”保留原始分辨率。大图下载可能需要稍等。</p></main>
<script>
const root=location.origin;
const names={'blue-archive':'碧蓝档案',genshin:'原神','star-rail':'崩坏：星穹铁道',arknights:'明日方舟','azur-lane':'碧蓝航线',touhou:'东方Project',miku:'初音未来',bocchi:'孤独摇滚',frieren:'葬送的芙莉莲',eva:'新世纪福音战士',anime:'其他二次元'};
const $=id=>document.getElementById(id);let catalog=[],items=[],page=0,updated='';const size=24;
for(const [id,name] of Object.entries(names)){const o=document.createElement('option');o.value=id;o.textContent=name;$('topic').append(o);}
function render(){const max=Math.max(1,Math.ceil(items.length/size));page=Math.max(0,Math.min(page,max-1));$('grid').replaceChildren();for(const item of items.slice(page*size,(page+1)*size)){const id=/wallhaven-([a-z0-9]{6})\./.exec(item.url)?.[1];if(!id)continue;const card=document.createElement('article');card.className='card';const preview=document.createElement('a');preview.href=root+'/wallpaper-cache'+new URL(item.url).pathname;preview.target='_blank';preview.rel='noopener';const img=document.createElement('img');img.src=root+'/wallpaper-thumb/small/'+id.slice(0,2)+'/'+id+'.jpg';img.alt='壁纸 '+id;img.loading='lazy';preview.append(img);card.append(preview);const body=document.createElement('div');body.className='body';const res=document.createElement('strong');res.textContent=item.resolution+' · '+id;const tags=document.createElement('div');tags.className='tags';tags.textContent=(item.topics||['anime']).map(t=>names[t]||t).join(' / ');const links=document.createElement('div');links.className='links';const source=document.createElement('a');source.textContent='来源页';source.href=item.page||'https://wallhaven.cc/w/'+id;source.target='_blank';source.rel='noopener';const download=document.createElement('a');download.textContent='下载原图';download.href=preview.href+'?download=1';download.download='wallhaven-'+id;links.append(source,download);body.append(res,tags,links);card.append(body);$('grid').append(card);}$('page').textContent=(page+1)+' / '+max;$('prev').disabled=page===0;$('next').disabled=page>=max-1;$('message').textContent='共 '+catalog.length+' 张 · 当前筛选 '+items.length+' 张'+updated;}
function filter(){const term=$('search').value.trim().toLowerCase(),topic=$('topic').value,min=Number($('quality').value);items=catalog.filter(x=>{const [w,h]=x.resolution.split('x').map(Number);return(topic==='all'||x.topics?.includes(topic))&&(!min||(w>=3840&&h>=2160))&&(!term||(x.url+' '+(x.topics||[]).map(t=>names[t]||t).join(' ')).toLowerCase().includes(term));});page=0;render();}
for(const id of ['topic','quality','search'])$(id).addEventListener('input',filter);$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
(async()=>{try{const response=await fetch(root+'/custom/hd-wallpapers.json',{cache:'no-store'});if(!response.ok)throw Error();catalog=await response.json();filter();try{const report=await(await fetch(root+'/custom/wallpaper-update.json',{cache:'no-store'})).json();updated=' · 更新于 '+new Date(report.updated_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});render();}catch{}}catch{$('message').textContent='暂时无法读取壁纸库，请用面板上的下载库链接打开。';}})();
</script></html>
